name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Pytest
        run: pytest

      - name: Build package
        run: python -m build

      - name: Wheel smoke
        run: |
          python -m venv .wheel-venv
          .wheel-venv/bin/python -m pip install --upgrade pip
          .wheel-venv/bin/python -m pip install dist/*.whl
          .wheel-venv/bin/full-stack-orchestrator --version
          .wheel-venv/bin/full-stack-orchestrator run-sample all --output .tmp/wheel-report
          test -f .tmp/wheel-report/index.html
          test -f .tmp/wheel-report/reports.html
          test -f .tmp/wheel-report/compare.html
          test -f .tmp/wheel-report/runs/*/index.html
          test -f .tmp/wheel-report/runs/*/exports/report-bundle.json
